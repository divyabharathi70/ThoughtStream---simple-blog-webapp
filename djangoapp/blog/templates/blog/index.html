{% extends 'blog/base.html'%} {% block content %}

<div class="container-fluid bg-light py-3">
  <div class="row my-2 align-items-center">
    <div class="col">
      <h4 class="text-dark">{{title}}</h4>
    </div>
    <div class="col-md-3">
      <form method="GET" action="{% url 'blog:index' %}" class="d-flex">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-search"></i>
          </span>
          <input
            type="text"
            class="form-control border-start-0 rounded-end"
            placeholder="Search posts..."
            name="q"
            aria-label="Search"
          />
          <button class="btn btn-primary" type="submit">Go</button>
        </div>
      </form>
    </div>
  </div>

  <div class="row m-3">
    {% if posts %} {% for post in posts %}
    <div class="col-md-4 mb-4">
      <div class="card post-card border-0">
        <img
          src="{{ post.img }}"
          class="card-img-top post-img"
          alt="post image"
        />

        <div class="card-body">
          <h5 class="card-title fw-semibold">{{ post.title }}</h5>
          <p class="card-text text-muted">
            {{ post.content|truncatechars:90 }}
          </p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <a
              href="{% url 'blog:detail' post.slug %}"
              style="text-decoration: none; color: black"
            >
              Read More
            </a>

            <span class="fw-bold text-dark small"
              >{{ post.category.category }}</span
            >
          </div>
        </div>
      </div>
    </div>
    {% endfor %} {% else %}
    <p class="text-muted">No Posts Available</p>
    {% endif %}
  </div>
</div>

<style>
  .post-card {
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
  }

  .post-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  }

  .post-img {
    width: 100%;
    height: 170px;
    object-fit: cover;
  }

  .card-title {
    font-size: 1.1rem;
    margin-bottom: 8px;
  }

  .card-text {
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .input-group .form-control {
    border-radius: 0 12px 12px 0;
  }

  .input-group-text {
    border-radius: 12px 0 0 12px;
    border-right: 0;
  }

  .input-group .btn {
    border-radius: 0 12px 12px 0;
  }
</style>

{% endblock %}
